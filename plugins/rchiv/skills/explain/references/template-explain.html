<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rchiv explain — {SERVICE_NAME}</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-card: #1a1d27;
    --bg-accent: #232738;
    --text: #e2e4e9;
    --text-muted: #8b8fa3;
    --accent: #6c8aff;
    --accent-dim: #6c8aff33;
    --border: #2a2d3a;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --purple: #a78bfa;
    --orange: #fb923c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    padding: 2rem;
    max-width: 960px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .badge {
    background: var(--accent-dim);
    color: var(--accent);
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  header h1 { font-size: 1.5rem; font-weight: 600; }
  .question-block {
    background: var(--bg-accent);
    border-left: 4px solid var(--accent);
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
    border-radius: 0 8px 8px 0;
    font-style: italic;
    color: var(--accent);
    font-size: 1.1rem;
  }
  .content h2 {
    color: var(--accent);
    font-size: 1.3rem;
    margin: 2rem 0 0.75rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .content h3 {
    color: var(--text);
    font-size: 1.1rem;
    margin: 1.5rem 0 0.5rem;
  }
  .content p { margin: 0.5rem 0; }
  .content ul, .content ol {
    margin: 0.5rem 0 0.5rem 1.5rem;
  }
  .content li { margin: 0.25rem 0; }
  .content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: 0.9rem;
  }
  .content th {
    background: var(--bg-accent);
    text-align: left;
    padding: 0.6rem 0.75rem;
    border-bottom: 2px solid var(--border);
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
  }
  .content td {
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid var(--border);
  }
  .content tr:hover td { background: var(--bg-accent); }
  .content code {
    background: var(--bg-accent);
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 0.85em;
    color: var(--accent);
  }
  .content pre {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    overflow-x: auto;
    margin: 1rem 0;
  }
  .content pre code {
    background: none;
    padding: 0;
    color: var(--text);
  }
  .content strong { color: #fff; }
  footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.8rem;
    display: flex;
    gap: 2rem;
  }
</style>
</head>
<body>
  <header>
    <span class="badge">.rchiv</span>
    <h1>{SERVICE_NAME}</h1>
  </header>
  <div class="question-block">{QUESTION}</div>
  <div class="content">
    {ANSWER_HTML}
  </div>
  <footer>
    <span>Service: {SERVICE_NAME}</span>
    <span>Date: {DATE}</span>
    <span>Commit: {COMMIT}</span>
  </footer>
</body>
</html>
